plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// imgui-java (anubis bundles it, we only compile against it)
	maven {
		url = "https://repo1.maven.org/maven2/"
		content {
			includeGroup "io.github.spair"
			// video player libraries
			includeGroup "org.bytedeco"
			includeGroup "org.jsoup"
			includeGroup "org.mozilla"
			includeGroup "com.google.protobuf"
			includeGroup "com.google.code.findbugs"
		}
	}
	// anubis isnt on a public maven, run `gradlew publishToMavenLocal` in the anubis repo and it shows up here
	mavenLocal {
		content { includeGroup "net.anubis" }
	}
	// libs anubis needs (imgui, jna etc), runClient loads anubis with these
	mavenCentral()
}

configurations {
	// libraries packed inside the addon jar (YouTube reading + video decoding), nothing is downloaded at runtime
	bundle { transitive = false }
}

loom {
	accessWidenerPath = file("src/main/resources/exav-addon.accesswidener")
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// drop an Anubis jar into libs/ to build against it directly, otherwise it comes from mavenLocal
	def anubisJars = fileTree(dir: "libs", include: "*nubis*.jar")
	if (!anubisJars.isEmpty()) {
		modImplementation files(anubisJars.files)
	} else {
		modImplementation "net.anubis:anubis-client:${project.anubis_version}"
	}
	// anubis ships imgui inside its jar, this is just so HUD overlay code compiles
	compileOnly "io.github.spair:imgui-java-binding:1.90.0"

	// Video Player: NewPipeExtractor reads YouTube (built from source, see bundled-libs/README.md), FFmpeg decodes
	bundle files("bundled-libs/newpipe-extractor-0.27.1.jar", "bundled-libs/nanojson.jar")
	bundle "org.jsoup:jsoup:1.24.1"
	bundle "org.mozilla:rhino:1.8.1"
	bundle "org.mozilla:rhino-engine:1.8.1"
	bundle "com.google.protobuf:protobuf-javalite:4.36.2"
	compileOnly "com.google.code.findbugs:jsr305:3.0.2"
	bundle "org.bytedeco:javacv:1.5.14"
	bundle "org.bytedeco:javacpp:1.5.14"
	bundle "org.bytedeco:javacpp:1.5.14:windows-x86_64"
	bundle "org.bytedeco:ffmpeg:8.1.2-1.5.14"
	bundle "org.bytedeco:ffmpeg:8.1.2-1.5.14:windows-x86_64"
	compileOnly files(configurations.bundle)
}

jar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from({ configurations.bundle.collect { zipTree(it) } }) {
		exclude "META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA", "META-INF/*.EC", "META-INF/MANIFEST.MF",
				"module-info.class", "META-INF/versions/*/module-info.class", "META-INF/maven/**"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
